[package]
name = "tgcaptcha-rs"
authors = ["Saeid Ghafari <saeid025@yahoo.com>"]
version = "0.2.0"
edition = "2021"
repository = "https://github.com/YouKnow-sys/tgcaptcha-rs"
license = "MIT"
description = "A Telegram bot that validates new users that enter to the supergroup or group with a simple math question."
keywords = ["telegram", "bot", "captcha", "group", "supergroup"]
readme = "README.md"

[dependencies]
log = { version = "0.4" }
pretty_env_logger = { version = "0.5" }
rand = { version = "0.9" }
serde = { version = "1.0", features = ["derive"] }
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
config = { version = "0.15", features = ["convert-case", "toml"], default-features = false }
humantime = { version = "2.3" }
humantime-serde = { version = "1.1" }
serde_with = { version = "3.14" }
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true
panic = "abort"
